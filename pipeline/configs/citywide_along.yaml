# Along-street branch with the adopted preprocessing (E35, option C; stack 2 m kept, E37). Writes cache/city/along_c_<i>.json.
detector_config: configs/dev_swath_v2_2.yaml
raw_root: ${ITALGAS_DATA}/Savona
branches: [along]
along_tag: _c
along_preprocess: {background: signature, lateral_background: true}
along_longitudinal: {}
chunk_m: 600.0
pad_m: 30.0
min_scans: 2000
keep_q: 0.2
along_travel_bias_m: 1.19  # m, ASSUMED (E25)
pp_fail_m: 5.0
sigma_floor_m: 0.3
